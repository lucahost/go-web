name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_cache:
        description: Skip npm cache
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_ENV: production

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ github.event.inputs.skip_cache == 'true' && '' || 'npm' }}

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: TypeScript type checking
        run: npm run typecheck

      - name: ESLint code quality
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Build for production
        run: npm run build

      - name: Prepare build artifacts
        run: |
          mkdir -p deploy-bundle
          cp -r .next deploy-bundle/
          cp -r public deploy-bundle/
          cp -r prisma deploy-bundle/
          rm -rf deploy-bundle/prisma/db/  # Exclude DB - it's persistent on server
          cp -r src deploy-bundle/
          cp package.json package-lock.json next.config.js ecosystem.config.js prisma.config.ts .env deploy-bundle/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: deploy-bundle/
          include-hidden-files: true
          retention-days: 30
          compression-level: 9

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    # The VPS only accepts SSH over Tailscale (public :22 is closed at the
    # Hetzner firewall). Join the tailnet as an ephemeral tagged node and use
    # Tailscale SSH (authn/authz via the tailnet ACL); no SSH key secrets needed.
    env:
      TS_HOSTNAME: 100.102.93.2
      SSH_USERNAME: dp-ubuntu-16gb
      SSH_OPTS: -o StrictHostKeyChecking=no

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: app/

      - name: Verify downloaded artifacts
        run: |
          echo "Contents of app/:"
          ls -la app/
          echo "Checking .next directory:"
          ls -la app/.next/ || echo "WARNING: .next not found in artifacts!"
          echo "Checking BUILD_ID:"
          cat app/.next/BUILD_ID || echo "WARNING: BUILD_ID not found!"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:prod-hetzner

      - name: Render .env.local
        env:
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          WEB_PUSH_EMAIL: ${{ secrets.WEB_PUSH_EMAIL }}
        run: |
          # Production overrides (take precedence over .env); shipped with the
          # bundle instead of being interpolated into a remote shell script.
          umask 077
          {
            printf 'DATABASE_URL="file:/opt/go-web/go.db"\n'
            printf 'WEB_PUSH_PRIVATE_KEY=%s\n' "$WEB_PUSH_PRIVATE_KEY"
            printf 'WEB_PUSH_EMAIL=%s\n' "$WEB_PUSH_EMAIL"
          } > app/.env.local

      - name: Deploy to Server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete --exclude='prisma/db/' -e "ssh $SSH_OPTS" \
            app/ "${SSH_USERNAME}@${TS_HOSTNAME}:${DEPLOY_PATH}/"

      - name: Install dependencies and restart
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Unquoted heredoc: DEPLOY_PATH expands on the runner.
          ssh $SSH_OPTS "${SSH_USERNAME}@${TS_HOSTNAME}" bash -s <<EOF
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          echo "Checking .next directory..."
          ls -la .next/ || { echo "ERROR: .next directory not found!"; exit 1; }
          test -f .next/BUILD_ID || { echo "ERROR: BUILD_ID not found in .next!"; exit 1; }
          echo "Build verified. Installing dependencies..."
          npm ci --omit=dev
          npx prisma generate
          npx prisma migrate deploy
          pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js
          pm2 save
          EOF
