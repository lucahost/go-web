name: Deploy

# pm2 on the host, over SSH. It goes after `sudo vps cutover go-web` (vps.yml deploys from then on).
# Until then both run on every push to main, so pm2 and the published artifact are the same commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_cache:
        description: Skip npm cache
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_ENV: production

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: ${{ github.event.inputs.skip_cache == 'true' && '' || 'npm' }}

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: TypeScript type checking
        run: npm run typecheck

      - name: ESLint code quality
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Build for production
        run: npm run build

      - name: Prepare build artifacts
        run: |
          mkdir -p deploy-bundle
          cp -r .next deploy-bundle/
          cp -r public deploy-bundle/
          cp -r prisma deploy-bundle/
          rm -rf deploy-bundle/prisma/db/  # Exclude DB - it's persistent on server
          cp -r src deploy-bundle/
          cp package.json package-lock.json next.config.js ecosystem.config.js prisma.config.ts .env deploy-bundle/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: production-build-${{ github.sha }}
          path: deploy-bundle/
          include-hidden-files: true
          retention-days: 30
          compression-level: 9

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    # 10 min of work + up to 10 min waiting for the host-wide deploy lock
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    # The VPS only accepts SSH over Tailscale (public :22 is closed at the
    # Hetzner firewall). Join the tailnet as an ephemeral tagged node and use
    # Tailscale SSH (authn/authz via the tailnet ACL); no SSH key secrets needed.
    env:
      TS_HOSTNAME: 100.102.93.2
      SSH_USERNAME: dp-ubuntu-16gb
      SSH_OPTS: -o StrictHostKeyChecking=no

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: production-build-${{ github.sha }}
          path: app/

      - name: Verify downloaded artifacts
        run: |
          echo "Contents of app/:"
          ls -la app/
          echo "Checking .next directory:"
          ls -la app/.next/ || echo "WARNING: .next not found in artifacts!"
          echo "Checking BUILD_ID:"
          cat app/.next/BUILD_ID || echo "WARNING: BUILD_ID not found!"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:prod-hetzner

      # Onboarding v2: once `sudo vps cutover go-web` has switched the host site to the cluster
      # (the generated site proxies to web's ClusterIP 10.43.0.37:3000), this deploy steps aside:
      # no rsync into /var/www/go and no pm2 restart. pm2 stays stopped, and the old SQLite file
      # stays as the cutover left it for a rollback. A rollback restores today's site, and with it
      # this deploy. The check holds the deploy lock the cutover holds; the restart step checks again.
      - name: Check where go-web runs
        id: where
        run: |
          set +e
          ssh $SSH_OPTS "${SSH_USERNAME}@${TS_HOSTNAME}" flock -w 600 -E 75 /run/lock/vps-deploy.lock \
            grep -qF "'proxy_pass http://10.43.0.37:3000'" /etc/nginx/sites-available/go.hostettler.io
          rc=$?
          set -e
          case $rc in
            0) echo "go-web runs in the VPS cluster (vps.yml deploys it): skipping pm2"; echo "pm2=false" >> "$GITHUB_OUTPUT";;
            1) echo "pm2=true" >> "$GITHUB_OUTPUT";;
            *) echo "::error::can't tell where go-web runs (exit $rc)"; exit 1;;
          esac

      - name: Render .env.local
        if: steps.where.outputs.pm2 == 'true'
        env:
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          WEB_PUSH_EMAIL: ${{ secrets.WEB_PUSH_EMAIL }}
        run: |
          # Production overrides (take precedence over .env); shipped with the
          # bundle instead of being interpolated into a remote shell script.
          umask 077
          {
            printf 'DATABASE_URL="file:/opt/go-web/go.db"\n'
            printf 'WEB_PUSH_PRIVATE_KEY=%s\n' "$WEB_PUSH_PRIVATE_KEY"
            printf 'WEB_PUSH_EMAIL=%s\n' "$WEB_PUSH_EMAIL"
          } > app/.env.local

      - name: Deploy to Server
        if: steps.where.outputs.pm2 == 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete --exclude='prisma/db/' -e "ssh $SSH_OPTS" \
            app/ "${SSH_USERNAME}@${TS_HOSTNAME}:${DEPLOY_PATH}/"

      - name: Install dependencies and restart
        if: steps.where.outputs.pm2 == 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Unquoted heredoc: DEPLOY_PATH expands on the runner.
          # One deploy at a time on the VPS, across all repos (see the 2026-11-23 freeze):
          # wait up to 10 min for /run/lock/vps-deploy.lock; exit code 75 = lock timeout.
          ssh $SSH_OPTS "${SSH_USERNAME}@${TS_HOSTNAME}" flock -w 600 -E 75 /run/lock/vps-deploy.lock bash -s <<EOF
          set -euo pipefail
          # Again under the lock: a cutover may have switched the site since the check above.
          if grep -qF 'proxy_pass http://10.43.0.37:3000' /etc/nginx/sites-available/go.hostettler.io; then
            echo "go-web runs in the VPS cluster (vps.yml deploys it): not restarting pm2"
            exit 0
          fi
          cd "${DEPLOY_PATH}"
          echo "Checking .next directory..."
          ls -la .next/ || { echo "ERROR: .next directory not found!"; exit 1; }
          test -f .next/BUILD_ID || { echo "ERROR: BUILD_ID not found in .next!"; exit 1; }
          echo "Build verified. Installing dependencies..."
          npm ci --omit=dev
          npx prisma generate
          npx prisma migrate deploy
          pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js
          pm2 save
          EOF
