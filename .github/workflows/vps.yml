name: VPS cluster

# go-web's deploy (Onboarding v2; lucahost/vps-gitops tenants/go-web.yaml): builds vps.yaml's web
# image (Dockerfile), pushes it to the box's registry as the zot user go-web and publishes the
# rendered artifact go-web/manifests:<sha>. It then moves live to that artifact, calls the
# Receiver and waits until Flux has applied it and it is Ready. While live is parked (a rollback),
# a run only publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # vps-deploy.yml joins the tailnet with this run's OIDC token

jobs:
  deploy:
    uses: lucahost/deploy-actions/.github/workflows/vps-deploy.yml@750f1298bd56c21f8e62dd1d95991e46a12b0caf   # vps-deploy, 2026-11-28 (ubuntu-26.04 runners, deploy-actions#21)
    with:
      file: vps.yaml
    # The Environment vps's two secrets reach the called job only this way. It would also pass
    # any repository secret, which vps-deploy.yml never reads.
    secrets: inherit
